services:
  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    env_file: .env
    networks:
      - public_net

  orchestrator:
    build: ./orchestrator
    ports:
      - "8001:8001"
    env_file: .env
    networks:
      - public_net
      - internal_net

  agent_echo:
    build: ./agents/agent_echo
    networks:
      - internal_net

networks:
  public_net:
  internal_net:
    internal: true